{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block body %}
<time class="live-clock public-clock" data-with-date="1"></time>
<main class="center-shell"><section class="card narrow">
<h1>Identificação</h1>
<form method="post">
<label>Usuário<input name="username" required autofocus></label>
<label>Senha<input type="password" name="password" required></label>
<button class="button primary" type="submit">Entrar</button>
</form>
</section></main>
{% endblock %}
