name: Portal Cloudflare - testes e publicacao

permissions:
  contents: read

on:
  push:
    paths:
      - 'portal/**'
      - 'URNA_ESCOLAR_SOURCE/01_SERVIDOR_ADMIN/publication_core/**'
      - 'tests/test_publication.py'
      - 'tests/export_cloudflare_fixtures.py'
      - '.github/workflows/portal-cloudflare.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar o portal na conta Cloudflare configurada'
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Preparar gerador de pacotes de teste isolado
        run: |
          python -m pip install -r URNA_ESCOLAR_SOURCE/01_SERVIDOR_ADMIN/requirements.txt -r installer/requirements-build.txt
      - name: Dependencias fixadas e validador do portal
        working-directory: portal/cloudflare
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run check
      - name: Conferir esquema compartilhado
        run: |
          python -c "import sys,json; sys.path.insert(0,'URNA_ESCOLAR_SOURCE/01_SERVIDOR_ADMIN'); from publication_core.schema import Document; assert Document.model_json_schema()==json.load(open('portal/cloudflare/document-schema.json'))"
      - name: Validar Worker, D1 e pacotes reais do protocolo
        working-directory: portal/cloudflare
        run: pnpm test
      - name: Bundle Cloudflare sem publicar
        working-directory: portal/cloudflare
        run: pnpm exec wrangler deploy --dry-run --outdir ../../test-results/cloudflare-bundle
      - name: Guardar logs locais de validacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Portal-Cloudflare-validacao
          path: test-results/cloudflare-*/worker*.log

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: portal/cloudflare
      - name: Conferir ID do banco e acesso configurado
        working-directory: portal/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "const fs=require('fs');if(fs.readFileSync('wrangler.toml','utf8').includes('00000000-0000-0000-0000-000000000000')||!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)throw Error('Configure o ID D1 e os secrets da conta Cloudflare antes de publicar')"
      - name: Aplicar migracoes e publicar na conta indicada
        working-directory: portal/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler d1 migrations apply urna-escolar-publicacoes --remote
          pnpm run deploy
