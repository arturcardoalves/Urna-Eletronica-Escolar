<text x="179" y="66" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#a9e5c5">ELEIÇÕES ESTUDANTIS</text>
<text x="58" y="146" font-size="64" font-weight="750" fill="#fff">Urna Escolar</text>
<text x="62" y="188" font-size="23" fill="#c7dce1">Participação na escola. Organização em cada etapa.</text>
