<rect x="828" width="384" height="66" rx="12" fill="#203f4b"/><text x="850" y="42" font-size="22" font-weight="700" fill="#afe4c6">03</text><text x="896" y="42" font-size="23" fill="#fff">Conferir o resultado</text>
</g>
